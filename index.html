<style>
  :root{
    --paper:#F6F4EF;
    --ink:#1C1A17;
    --meta:#5A554C;
    --accent:#7A2E2E;      /* oxblood */
    --hairline:#E4DFD5;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;
    font-size:1.25rem;
    line-height:1.7;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:40rem;margin:0 auto;padding:clamp(3rem,8vw,6rem) 1.5rem 4rem;}

  /* ---- masthead / title page ---- */
  .masthead{text-align:center;margin-bottom:3.5rem;}
  .masthead h1{
    font-size:clamp(2.6rem,9vw,4rem);
    font-weight:500;
    letter-spacing:.005em;
    line-height:1.05;
    margin:0 0 .6rem;
  }
  .masthead .tagline{
    font-style:italic;
    color:var(--meta);
    font-size:1.15rem;
    margin:0;
  }
  .rule{
    width:3rem;height:1px;background:var(--accent);
    border:0;margin:2.4rem auto 0;
  }

  /* ---- contents ---- */
  .contents{list-style:none;margin:0;padding:0;}
  .entry{padding:2rem 0;border-bottom:1px solid var(--hairline);}
  .entry:first-child{padding-top:0;}
  .entry a.title-link{
    display:inline-block;
    color:var(--ink);
    text-decoration:none;
    font-size:1.7rem;
    font-weight:500;
    line-height:1.2;
    margin-bottom:.35rem;
  }
  .entry a.title-link:hover,
  .entry a.title-link:focus-visible{color:var(--accent);}
  .entry .meta{
    font-family:var(--sans);
    font-size:.8rem;
    letter-spacing:.02em;
    color:var(--meta);
    margin-bottom:.5rem;
  }
  .entry .summary{font-style:italic;color:var(--meta);margin:0;font-size:1.1rem;}

  footer{
    margin-top:4rem;text-align:center;
    font-family:var(--sans);font-size:.8rem;color:var(--meta);
  }
  footer a{color:var(--meta);}

  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}

  @media (max-width:480px){
    body{font-size:1.18rem;}
    .entry a.title-link{font-size:1.45rem;}
  }
</style>
<script data-goatcounter="https://diggingdeeper.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<body>
  <div class="wrap">

    <header class="masthead">
      <h1>Digging Deeper</h1>

      <hr class="rule">
    </header>

        </li>

      </ul>
    </main>

    <footer>
      <p>Digging Deeper · <a href="mailto:you@example.com">get in touch</a></p>
    </footer>

  </div>
</body>
